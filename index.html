<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzadinha de Arquitetura Computacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header class="topo-hud">
            <div class="titulo-grupo">
                <span class="tag-edicao">VICE ARCH • ARQCOMP</span>
                <h1>Cruzadinha de Arquitetura Computacional</h1>
            </div>

            <div class="controles">
                <div class="placar" id="contador">0 de 13 palavras</div>
                <div class="botoes">
                    <button id="btn-conferir" type="button" class="btn btn-primario">Conferir</button>
                    <button id="btn-reiniciar" type="button" class="btn btn-secundario">Reiniciar</button>
                </div>
            </div>
        </header>

                <div class="barra-info">
            <p id="pista-ativa" class="pista-ativa">Clique em uma casa ou pista para começar a jogar (sem acentos e sem espaços).</p>
            <p id="mensagem-status" class="mensagem-status" aria-live="polite"></p>
        </div>

        <section class="area-tabuleiro">
            <div id="tabuleiro" class="tabuleiro" aria-label="Tabuleiro da cruzadinha"></div>
        </section>

        <section class="area-pistas">
            <div class="coluna-pistas">
                <h2>Horizontais</h2>
                <ul id="pistas-horizontais" class="lista-pistas"></ul>
            </div>
            <div class="coluna-pistas">
                <h2>Verticais</h2>
                <ul id="pistas-verticais" class="lista-pistas"></ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
